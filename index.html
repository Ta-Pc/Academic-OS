<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academic-OS Setup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slide-up {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-fade-in {
      animation: fade-in 0.3s ease-out forwards;
    }
    .animate-slide-up {
      animation: slide-up 0.4s ease-out forwards;
    }
    @keyframes pulse-once {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.3); } /* blue-500 with opacity */
      100% { transform: scale(1); }
    }
    .animate-pulse-once {
      animation: pulse-once 0.8s ease-in-out;
    }
    /* Custom Global Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    .dark ::-webkit-scrollbar-track {
      background-color: #1e293b; /* slate-800 */
    }
    ::-webkit-scrollbar-thumb {
      background-color: #94a3b8; /* slate-400 */
      border-radius: 10px;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover {
      background-color: #64748b; /* slate-500 */
    }
    .dark ::-webkit-scrollbar-thumb {
      background-color: #475569; /* slate-600 */
    }
    .dark ::-webkit-scrollbar-thumb:hover {
      background-color: #64748b; /* slate-500 */
    }
    .font-small-caps {
      font-variant: small-caps;
    }
    .hatch-pattern {
      background-image: repeating-linear-gradient(
        45deg,
        rgba(239, 68, 68, 0.6), /* red-500 with opacity */
        rgba(239, 68, 68, 0.6) 5px,
        rgba(239, 68, 68, 0.4) 5px, /* slightly lighter red */
        rgba(239, 68, 68, 0.4) 10px
      );
    }
    @keyframes flash-bg {
      0% { background-color: transparent; }
      25% { background-color: rgba(59, 130, 246, 0.2); } /* blue-500 with opacity */
      100% { background-color: transparent; }
    }
    .animate-flash {
      animation: flash-bg 1.5s ease-out;
    }
    /* Custom Select Arrow */
    select {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      background-image: url('data:image/svg+xml;charset=UTF-8,%3csvg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20"%3e%3cpath stroke="%236b7280" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 8l4 4 4-4"/%3e%3c/svg%3e');
      background-position: right 0.5rem center;
      background-repeat: no-repeat;
      background-size: 1.5em 1.5em;
    }
    .dark select {
      background-image: url('data:image/svg+xml;charset=UTF-8,%3csvg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20"%3e%3cpath stroke="%239ca3af" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 8l4 4 4-4"/%3e%3c/svg%3e');
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "date-fns": "https://cdn.jsdelivr.net/npm/date-fns@3.6.0/fesm/index.mjs",
    "vite": "https://aistudiocdn.com/vite@^7.1.7",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.0.4",
    "path": "https://aistudiocdn.com/path@^0.12.7",
    "sql.js": "https://aistudiocdn.com/sql.js@^1.13.0",
    "process": "https://aistudiocdn.com/process@^0.11.10",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.544.0"
  }
}
</script>

</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
